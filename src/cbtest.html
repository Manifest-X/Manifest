<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles/core/manifest.theme.css">
  <link rel="stylesheet" href="/styles/core/manifest.reset.css">
  <link rel="stylesheet" href="/styles/elements/manifest.button.css">
  <link rel="stylesheet" href="/styles/elements/manifest.checkbox.css">
  <link rel="stylesheet" href="/styles/elements/manifest.input.css">
  <link rel="stylesheet" href="/styles/elements/manifest.dropdown.css">
  <link rel="stylesheet" href="/styles/elements/manifest.combobox.css">
  <link rel="stylesheet" href="/styles/elements/manifest.typography.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="/scripts/manifest.combobox.js"></script>
</head>
<body>
  <main x-data="{
          roles: ['owner', 'editor'],
          owners: 1,
          all: [
            { v: 'owner',   l: 'Owner' },
            { v: 'editor',  l: 'Editor' },
            { v: 'viewer',  l: 'Viewer' },
            { v: 'billing', l: 'Billing admin' }
          ]
        }"
        style="padding: 2rem; max-width: 42rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem;">

    <h3>Roles editor — x-for options + reactive lock</h3>

    <input x-combobox.multiple.chips="rolesMenu" x-model="roles" placeholder="Add roles" style="max-width: 32rem;">
    <menu popover id="rolesMenu">
      <template x-for="o in all" :key="o.v">
        <li :data-value="o.v"
            :data-label="o.l"
            :data-locked="(o.v == 'owner' && owners <= 1) || null"
            :style="o.v == 'billing' ? 'color: #c0392b' : ''"
            x-text="o.l"></li>
      </template>
    </menu>

    <label class="row" style="gap: 0.5rem; align-items: center;">
      <input type="checkbox" :checked="owners <= 1" @change="owners = owners <= 1 ? 2 : 1">
      Sole owner — locks the Owner chip (× hidden, can't remove)
    </label>

    <pre x-text="'roles = ' + JSON.stringify(roles)" style="margin: 0;"></pre>

    <p class="small" style="opacity: .7;">
      Open the field to pick roles. “Billing admin” is styled red in the list to show authored
      per-option styling survives. Toggle the checkbox to lock/unlock the Owner chip live.
    </p>
  </main>
</body>
</html>
