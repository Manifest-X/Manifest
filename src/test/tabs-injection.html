<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabs injection test</title>
  <link rel="stylesheet" href="/styles/core/manifest.theme.css">
  <link rel="stylesheet" href="/styles/core/manifest.reset.css">
  <link rel="stylesheet" href="/styles/elements/manifest.button.css">
  <link rel="stylesheet" href="/styles/elements/manifest.form.css">
  <link rel="stylesheet" href="/styles/utilities/manifest.colors.css">
  <link rel="stylesheet" href="/styles/utilities/manifest.utilities.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="/scripts/manifest.dropdowns.js"></script>
  <script src="/scripts/manifest.tabs.js"></script>
</head>

<body class="page p-20">

  <!-- Static group, unnamed set (page-level `tab` prop, body scope owned by dropdowns plugin) -->
  <section class="col gap-2">
    <small>Static group</small>
    <div class="row gap-2">
      <button x-tab="static-1">One</button>
      <button x-tab="static-2">Two</button>
    </div>
    <div class="static-1" x-tabpanel>Static panel one</div>
    <div class="static-2" x-tabpanel>Static panel two</div>
  </section>

  <!-- Injected groups land here after Alpine has initialized -->
  <section id="late" class="col gap-8 mt-8"></section>

  <script>
    setTimeout(() => {
      document.getElementById('late').innerHTML = `
        <div class="col gap-2">
          <small>Tab group A (author tablist)</small>
          <div role="tablist">
            <button x-tab="first-a">First</button>
            <button x-tab="second-a">Second</button>
          </div>
          <div class="first-a" x-tabpanel="a">A. First content</div>
          <div class="second-a" x-tabpanel="a">A. Second content</div>
        </div>
        <div class="col gap-2">
          <small>Tab group B (bare wrapper)</small>
          <div class="row gap-2">
            <button x-tab="first-b">First</button>
            <button x-tab="second-b">Second</button>
          </div>
          <div class="first-b" x-tabpanel="b">B. First content</div>
          <div class="second-b" x-tabpanel="b">B. Second content</div>
        </div>`;
    }, 800);
  </script>

</body>

</html>
