<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>combobox chip padding leak (inside label)</title>
<link rel="stylesheet" href="/styles/core/manifest.theme.css">
<link rel="stylesheet" href="/styles/core/manifest.reset.css">
<link rel="stylesheet" href="/styles/elements/manifest.form.css">
<link rel="stylesheet" href="/styles/elements/manifest.avatar.css">
<link rel="stylesheet" href="/styles/elements/manifest.combobox.css">
<link rel="stylesheet" href="/styles/elements/manifest.dropdown.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="/scripts/manifest.combobox.js"></script>
<script src="/scripts/manifest.dropdowns.js"></script>
</head>
<body x-data="{}" style="padding:2rem;display:flex;flex-direction:column;gap:2rem;max-width:32rem">

<!-- Combobox with rich (avatar) chips, INSIDE a label -->
<div x-data="{ picked: ['AM','BO'] }">
  <label>Assignees
    <input x-combobox.multiple.chips="people" x-model="picked">
    <menu popover id="people">
      <li data-value="AM" data-label="Amy"><span data-chip style="display:flex;align-items:center;gap:.375rem"><span class="avatar sm">A</span>Amy</span></li>
      <li data-value="BO" data-label="Bo"><span data-chip style="display:flex;align-items:center;gap:.375rem"><span class="avatar sm">B</span>Bo</span></li>
    </menu>
  </label>
</div>

</body>
</html>
