<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>toast dead-zone</title>
<link rel="stylesheet" href="/styles/core/manifest.theme.css">
<link rel="stylesheet" href="/styles/core/manifest.reset.css">
<link rel="stylesheet" href="/styles/elements/manifest.toast.css">
<link rel="stylesheet" href="/styles/elements/manifest.button.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="/scripts/manifest.toasts.js"></script>
</head>
<body x-data="{ hits: 0 }">

<!-- A control sitting exactly where the toast container lives (bottom-centre) -->
<div style="position:fixed; bottom:3vw; left:50%; transform:translateX(-50%); z-index:1">
  <button id="under" @click="hits++">Under-toast button (hits: <span x-text="hits"></span>)</button>
</div>

<button id="fire" x-toast.positive="'Saved!'" style="margin:2rem">Fire toast</button>

</body>
</html>
