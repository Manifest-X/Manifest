# Framework tests. Runs on every push and pull request, and gates npm releases (release.yml calls it).
name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Called runs (release.yml) get their own group so back-to-back releases never cancel each other.
concurrency:
  group: ${{ github.workflow == 'Test' && format('test-{0}', github.ref) || format('test-call-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.workflow == 'Test' && github.event_name == 'push' && github.ref != 'refs/heads/master' }}

jobs:
  unit:
    name: Unit tests + build drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_TIME_SCALE: '3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: lib/ and packages/ match a fresh build of src/
        run: |
          npm run build
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain | while IFS= read -r line; do echo "::error title=Build drift::${line}"; done
            echo "::error title=Build drift::Run npm run build and commit the result."
            exit 1
          fi
